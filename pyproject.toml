[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ueagentinterfacecmd"
version = "0.4.0"
description = "Transport-neutral Python SDK and CLI for UeAgentInterface"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UeAgentInterfaceCMD" }]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
authoring = ["hjson>=3.1,<4"]

[project.scripts]
ueagentinterfacecmd = "uai_cli.main:main"
uai-cli = "uai_cli.main:main"

[tool.setuptools]
package-dir = { "" = "cli" }

[tool.setuptools.packages.find]
where = ["cli"]

[tool.setuptools.package-data]
"uai.commands" = ["*.pyi"]

[tool.pytest.ini_options]
norecursedirs = ["retired"]
markers = [
]
